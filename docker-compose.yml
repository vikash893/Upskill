version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "10000-10100:10000-10100/udp"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/uniskill
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - JWT_SECRET=uniskill_jwt_secret_key_production_2026
      - RECORDING_CHUNK_SECONDS=60
      - RECORDING_STORAGE_PATH=/app/uploads/recordings
      - MEDIA_SERVER_TYPE=mediasoup
    depends_on:
      - mongodb
      - redis
      - kafka
    volumes:
      - recordings_data:/app/uploads/recordings

  recording-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node -e "require('./src/modules/live-class/services/recording.worker.js')"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/uniskill
      - REDIS_URL=redis://redis:6379
      - RECORDING_STORAGE_PATH=/app/uploads/recordings
    depends_on:
      - mongodb
      - redis
    volumes:
      - recordings_data:/app/uploads/recordings

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  mongo_data:
  recordings_data:
